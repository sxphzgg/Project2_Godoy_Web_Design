<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Places Ethan and I have visited together and the memories we made there.">
  <title>Places We’ve Been</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #dceeff;
      color: #302727;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 6%;
      background-color: white;
    }

    .site-name {
      color: #8b3a3a;
      font-size: 1.2rem;
      font-weight: bold;
      text-decoration: none;
      white-space: nowrap;
    }

    .main-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 18px;
    }

    .main-nav a {
      color: #302727;
      text-decoration: none;
    }

    .main-nav a:hover,
    .main-nav a:focus-visible,
    .main-nav a[aria-current="page"] {
      color: #8b3a3a;
      text-decoration: underline;
    }

    .main-nav a:active {
      color: #692b2b;
    }

    main {
      width: min(1000px, 92%);
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    h1 {
      margin-bottom: 8px;
      color: #8b3a3a;
      text-align: center;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    .intro {
      max-width: 700px;
      margin: 0 auto 24px;
      text-align: center;
    }

    #map {
      width: 100%;
      height: 480px;
      border: 4px solid white;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    .leaflet-popup-content {
      width: 220px;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    .leaflet-popup-content img {
      display: block;
      width: 100%;
      max-height: 150px;
      margin-top: 8px;
      border-radius: 8px;
      object-fit: cover;
    }

    @media (max-width: 700px) {
      .site-header {
        flex-direction: column;
      }

      .main-nav {
        justify-content: center;
      }

      #map {
        height: 400px;
      }
    }

    @media (max-width: 480px) {
      #map {
        height: 360px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="site-name" href="index.html">Five Years Together</a>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about-ethan.html">About Ethan</a>
      <a href="our-story.html">Our Story</a>
      <a href="gallery.html">Photo Gallery</a>
      <a href="map.html" aria-current="page">Map</a>
    </nav>
  </header>

  <main>
    <h1>Places We’ve Been Together</h1>

    <p class="intro">
      Each pin marks a trip and a memory Ethan and I made together.
      Click a pin to see the place, a photo, and a little piece of our story.
    </p>

    <div id="map" aria-label="Interactive map of places Ethan and I have visited"></div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    const map = L.map("map");

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const memories = [
      {
        coordinates: [39.0968, -120.0324],
        title: "Lake Tahoe",
        description: "One of the stops on our big California trip."
      },
      {
        coordinates: [37.6273, -118.9899],
        title: "Mammoth Lakes",
        description: "One of the stops on our big California trip."
      },
      {
        coordinates: [36.4864, -118.5658],
        title: "Sequoia National Park",
        description: "One of the stops on our big California trip.",
        image: "photos/seq.jpeg",
        imageAlt: "Ethan and me visiting Sequoia National Park"
      },
      {
        coordinates: [37.7433, -119.5758],
        title: "Yosemite",
        description: "Our last stop before heading back home."
      },
      {
        coordinates: [34.0522, -118.2437],
        title: "Home area",
        description: "We came back home after our California trip. This pin is approximate."
      },
      {
        coordinates: [37.7749, -122.4194],
        title: "San Francisco",
        description: "Our first time in San Francisco was to see The Strokes.",
        image: "photos/sanfran.jpg",
        imageAlt: "Ethan and me in San Francisco"
      },
      {
        coordinates: [30.2669, -97.7728],
        title: "Austin, Texas",
        description: "We flew out of state to see The Strokes at Austin City Limits.",
        image: "photos/txt.jpeg",
        imageAlt: "A memory from our trip to Austin"
      },
      {
        coordinates: [32.7157, -117.1611],
        title: "San Diego",
        description: "A recent trip together."
      },
      {
        coordinates: [33.6046, -114.5309],
        title: "Welcome to Arizona",
        description: "The big Arizona sign we saw when we crossed into the state."
      },
      {
        coordinates: [38.6814, -119.5482],
        title: "Nevada — U.S. Route 395 at Topaz Lake",
        description: "We stopped at the stone “Battle Born” sign near Topaz Lake."
      },
      {
        coordinates: [20.617, -105.230],
        title: "Puerto Vallarta, Mexico",
        description: "A stop on our trip to Mexico."
      },
      {
        coordinates: [23.2216, -106.4189],
        title: "Mazatlán, Mexico",
        description: "A stop on our trip to Mexico."
      },
      {
        coordinates: [22.8905, -109.9167],
        title: "Los Cabos, Mexico",
        description: "A stop on our trip to Mexico."
      },
      {
        coordinates: [24.1423, -110.3132],
        title: "La Paz, Mexico",
        description: "A stop on our trip to Mexico."
      }
    ];

    const markers = memories.map(function (memory) {
      let popupContent = `
        <strong>${memory.title}</strong><br>
        ${memory.description}
      `;

      if (memory.image) {
        popupContent += `
          <img src="${memory.image}" alt="${memory.imageAlt}">
        `;
      }

      return L.marker(memory.coordinates)
        .addTo(map)
        .bindPopup(popupContent);
    });

    map.fitBounds(L.featureGroup(markers).getBounds(), {
      padding: [40, 40]
    });
  </script>
</body>
</html>
